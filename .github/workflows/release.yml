name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build tts_broadcast.zip (contents of custom_components/tts_broadcast only)
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          src = Path("custom_components/tts_broadcast")
          out = Path("tts_broadcast.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for path in sorted(src.rglob("*")):
                  if "__pycache__" in path.parts or path.suffix == ".pyc":
                      continue
                  z.write(path, path.relative_to(src))
          print(f"wrote {out}")
          PY

      - name: Extract changelog section for this release
        id: changelog
        run: |
          python - <<'PY'
          import os, re, pathlib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(rf"^## \[{re.escape(tag)}\]\b.*?$(?=^## \[|$)", re.M | re.S)
          m = pattern.search(text)
          body = m.group(0).strip() if m else f"Release {tag}"
          pathlib.Path("release_body.md").write_text(body, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"body<<EOF\n{body}\nEOF\n")
          PY

      - name: Create GitHub Release and attach zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TTS Broadcast ${{ github.ref_name }}
          body_path: release_body.md
          files: tts_broadcast.zip
          draft: false
          prerelease: false
